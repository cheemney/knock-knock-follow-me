<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knock Knock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="header">
        <h1 id="app-name">Knock Knock</h1>
        <p id="subtitle" class="subtitle"></p>
      </header>

      <form id="settings-form" novalidate>
        <div class="field">
          <label id="username-label" for="username"></label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            maxlength="39"
            pattern="[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?"
            required
          />
        </div>

        <div class="field">
          <label id="language-label" for="language"></label>
          <select id="language" name="language"></select>
        </div>

        <button id="save-button" type="submit"></button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="privacy-note" class="privacy-note"></p>

      <a
        id="report-bug"
        class="link"
        href="https://github.com/alicangunduz/knock-knock-follow-me/issues/new"
        target="_blank"
        rel="noreferrer"
      ></a>
    </main>

    <script src="localization.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
